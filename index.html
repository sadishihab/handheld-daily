<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b2e26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Handheld Daily</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="screen">
    <h1 class="visually-hidden">Handheld Daily</h1>
    <div class="lcd" id="lcd">
      <canvas id="screen" class="lcd__canvas"
        aria-label="Ship rescue. Touch a side of the screen to send that side's boat to the dock you touch."></canvas>

      <!-- Overlay for the non-play screens. Real DOM rather than canvas: the
           share control has to be a focusable button that a screen reader can
           reach, and the Web Share API needs a genuine user gesture. -->
      <div class="panel" id="panel" role="dialog" aria-live="polite" hidden>
        <div class="panel__inner">
          <p class="panel__eyebrow" id="panel-eyebrow"></p>
          <p class="panel__title" id="panel-title"></p>
          <dl class="panel__stats" id="panel-stats"></dl>
          <p class="panel__note" id="panel-note" hidden></p>
          <div class="panel__actions" id="panel-actions"></div>
          <p class="panel__footer" id="panel-footer" hidden></p>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
